name: b2t
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults

dependencies:
  # ---- Python ----
  - python=3.10

  # ---- Core scientific stack ----
  - numpy>=1.24,<2.0   # let pyctcdecode be happy; no NumPy 2.x
  - scipy
  - pandas
  - scikit-learn

  # ---- PyTorch + CUDA 11.8 ----
  - pytorch
  - torchvision
  - torchaudio
  - pytorch-cuda=11.8

  # ---- HuggingFace / audio / plotting ----
  - transformers
  - datasets
  - tokenizers
  - librosa
  - pysoundfile
  - matplotlib
  - seaborn

  # ---- Misc ----
  - tqdm
  - ipykernel
  - pydantic<2
  - protobuf

  # ---- pip fallback ----
  - pip
  - pip:
      - g2p-en          # instead of g2p_en
      - pyctcdecode
      - elevenlabs==1.7.0
      - torcheval==0.0.7
      # kenlm: install manually later as you’ve been doing
